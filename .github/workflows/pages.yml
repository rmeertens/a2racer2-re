name: GitHub Pages

# Builds dist/ and publishes it as the site at a2racer.meertens.dev. rcs.img is over git's
# 100 MB limit per file, so the site goes up as a Pages artifact, not from a branch: npm ci
# restores it from large-files/. Multiplayer on a static site goes through the public PeerJS
# broker: docs/multiplayer.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/large-files.mjs restore
      - run: npm run build
      - name: Custom domain
        run: echo 'a2racer.meertens.dev' > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's side can take longer than the default 10 minutes for a site this size
          # (rcs.img alone is over 100 MB); twice it timed out on 9 and 10 November 2026.
          timeout: 1800000
