name: GitHub Pages

# Builds dist/ and publishes it as the site at a2racer.meertens.dev. rcs.img is over git's
# 100 MB limit per file, so the site goes up as a Pages artifact, not from a branch: npm ci
# restores it from large-files/. Multiplayer on a static site goes through the public PeerJS
# broker: docs/multiplayer.md.
on:
  push:
    branches: [main]
    # These files are not copied to dist; use workflow_dispatch for a manual retry.
    paths-ignore:
      - 'README.md'
      - 'PLAN.md'
      - 'docs/**'
      - 'evidence/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/large-files.mjs restore
      - run: npm run build
      - name: Custom domain
        run: echo 'a2racer.meertens.dev' > dist/CNAME
      - name: Report publish size
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, statSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const files = [];
          const walk = dir => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name), stat = statSync(path);
              if (stat.isDirectory()) walk(path);
              else files.push({ path, bytes: stat.size });
            }
          };
          walk('dist');
          const mib = n => (n / 1024 ** 2).toFixed(1);
          const total = files.reduce((sum, f) => sum + f.bytes, 0);
          const summary = [
            `Publish payload: ${files.length} files, ${mib(total)} MiB uncompressed.`,
            '', 'Largest files:',
            ...files.sort((a, b) => b.bytes - a.bytes).slice(0, 5).map(f => `- ${f.path}: ${mib(f.bytes)} MiB`),
            '', 'Build/upload timings and Pages queue/sync timings are separate in the job logs.',
          ].join('\n');
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages v4 clamps this input to 600000; larger values do not
          # extend the wait. See docs/releasing.md for the sync-stall diagnosis.
          timeout: 600000
